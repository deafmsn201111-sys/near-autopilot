# Local stack: Postgres + mainnet collector (view calls only) + read-only analytics API + the site (127.0.0.1:3001).
#   ./scripts/quickstart.sh       (or: cp .env.example .env, fill the secrets, docker compose up -d --build)
# Host ports are bound to 127.0.0.1 only; override with POSTGRES_HOST_PORT / ANALYTICS_API_HOST_PORT /
# ANALYTICS_DASHBOARD_PORT if taken. The server never holds a key: a transaction is only ever signed in the user's wallet.
x-collector-env: &collector-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
  DATABASE_URL: postgres://${POSTGRES_USER:-autopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autopilot}
  NEAR_NETWORK: mainnet
  # The demo portfolios are simulated (in-process mock RPC, NEAR_RPC_URL never contacted); market data is real mainnet.
  DATA_SOURCE: simulation
  EXECUTION_MODE: dry-run
  NEAR_RPC_URL: https://rpc.mainnet.near.org
  AUTOPILOT_ACCOUNT_ID: shadow-demo.near
  AUTOPILOT_ENGINE: orchestrator
  MARKET_CONFIG_FILE: /etc/near-autopilot/market.json
  MARKET_DATA: mainnet-live
  YIELD_DATA: mainnet-onchain
  RHEA_DCL_CONTRACT_ID: dclv2.ref-labs.near
  MAINNET_READ_RPC_URL: ${MAINNET_READ_RPC_URL:-https://rpc.mainnet.fastnear.com}
  MAINNET_READ_RPC_API_KEY: ${MAINNET_READ_RPC_API_KEY:-}
  PYTH_API_KEY: ${PYTH_API_KEY:-}
  PYTH_HERMES_URL: ${PYTH_HERMES_URL:-https://hermes.pyth.network}
  DEFILLAMA_URL: ${DEFILLAMA_URL:-https://coins.llama.fi}
  COINBASE_URL: ${COINBASE_URL:-https://api.exchange.coinbase.com}
  KRAKEN_URL: ${KRAKEN_URL:-https://api.kraken.com}
  BINANCE_URL: ${BINANCE_URL:-https://data-api.binance.vision}
  ONE_CLICK_URL: ${ONE_CLICK_URL:-https://1click.chaindefuser.com}
  # shadow-demo.near does not exist on mainnet and 1Click refuses it; a dry quote sends nothing to this account.
  ONE_CLICK_QUOTE_ACCOUNT: ${ONE_CLICK_QUOTE_ACCOUNT:-near}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autopilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations, then serves the stored data read-only (plus the wallet cascade builder).
  analytics-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: near-autopilot-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      DATABASE_URL: postgres://${POSTGRES_USER:-autopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autopilot}
      API_PORT: 4000
      SHADOW_CYCLE_INTERVAL_SECONDS: ${SHADOW_CYCLE_INTERVAL_SECONDS:-900}
      AUDIT_CHECKPOINT_PUBLIC_KEY: ${AUDIT_CHECKPOINT_PUBLIC_KEY:-}
      AUDIT_CHECKPOINT_FILE: /checkpoints/checkpoints.jsonl
      # "your account" (read-only view calls): the same private RPC and key as the collector
      MAINNET_READ_RPC_URL: ${MAINNET_READ_RPC_URL:-https://rpc.mainnet.fastnear.com}
      MAINNET_READ_RPC_API_KEY: ${MAINNET_READ_RPC_API_KEY:-}
      # 1Click partner JWT for deposit quotes: only this service gets it. Empty = keyless fee schedule.
      ONE_CLICK_JWT: ${ONE_CLICK_JWT:-}
      # Server LLM: only this service gets the key. Empty = LLM off, heuristics only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      LLM_DAILY_CAP_USD: ${LLM_DAILY_CAP_USD:-5}
      # The only token /v1/admin/* accepts (quickstart.sh adds it). Empty = the admin routes answer 401.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      MARKET_CONFIG_FILE: /etc/near-autopilot/market.json
    ports:
      - '127.0.0.1:${ANALYTICS_API_HOST_PORT:-4003}:4000'
    volumes:
      - ./evidence/checkpoints:/checkpoints:ro
      - ./config/market.json:/etc/near-autopilot/market.json:ro

  # Reads mainnet on a schedule (view calls only), stores it and analyses the demo portfolios. No LLM, no signer.
  collector:
    image: near-autopilot-api:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    command: ['node', '--import', 'tsx', 'src/collector/main.ts']
    environment:
      <<: *collector-env
      SHADOW_CYCLE_INTERVAL_SECONDS: ${SHADOW_CYCLE_INTERVAL_SECONDS:-900}
      COLLECTOR_REGISTRY_EVERY: ${COLLECTOR_REGISTRY_EVERY:-4}
      COLLECTOR_HEALTH_PORT: 4100
      # signed audit checkpoints (evidence/checkpoint.ts): the private key stays in .env, never in the database
      AUDIT_CHECKPOINT_KEY: ${AUDIT_CHECKPOINT_KEY:-}
      AUDIT_CHECKPOINT_FILE: /checkpoints/checkpoints.jsonl
    volumes:
      - ./config/market.json:/etc/near-autopilot/market.json:ro
      # outside the database volume: the independent copy of the checkpoints
      - ./evidence/checkpoints:/checkpoints
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/health']
      interval: 30s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    image: near-autopilot-analytics:local
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://analytics-api:4000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      # 1 = the site may hand a validated, unsigned cascade to the connected wallet for the user to sign.
      MAINNET_WALLET_SIGNING: ${MAINNET_WALLET_SIGNING:-}
    ports:
      - '127.0.0.1:${ANALYTICS_DASHBOARD_PORT:-3001}:3000'

  # The admin (/admin: AI spend, kill switch, cap): the same image with ADMIN_UI=1, on 127.0.0.1:3002 only.
  analytics-admin:
    image: near-autopilot-analytics:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      analytics:
        condition: service_started
      analytics-api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://analytics-api:4000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_UI: '1'
    ports:
      - '127.0.0.1:${ANALYTICS_ADMIN_PORT:-3002}:3000'

volumes:
  pgdata:
