<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1013">
<title>Autopilot portfolio UX prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* v5. Dark-first. Surfaces from measured references (Uniswap/Aave: hero on the page, cards ≈10% of area),
   neutral tint H275, one violet voice (H282) for the AI decision → #1 suggestion → Sign. Status colour only on risk. */
:root {
  color-scheme: dark;
  --bg-inset: oklch(.135 .005 275); --bg-page: oklch(.160 .005 275); --bg-surface: oklch(.192 .006 275);
  --bg-raised: oklch(.228 .007 275); --bg-overlay: oklch(.255 .007 275);
  --hover: rgb(255 255 255 / .05); --active: rgb(255 255 255 / .08);
  --line-subtle: rgb(255 255 255 / .06); --line: rgb(255 255 255 / .085); --line-strong: rgb(255 255 255 / .15); --line-control: rgb(255 255 255 / .22);
  --line-input: rgb(255 255 255 / .36); --line-mark: rgb(255 255 255 / .40);
  --text-1: oklch(.985 .002 275); --text-2: oklch(.80 .008 275); --text-3: oklch(.66 .010 275); --text-dis: oklch(.48 .008 275);
  --neutral-solid: oklch(.985 .002 275); --neutral-ink: oklch(.16 .005 275);
  --accent: oklch(.74 .15 282); --accent-muted: oklch(.74 .15 282 / .13); --accent-line: oklch(.74 .15 282 / .60);
  --sign: oklch(.57 .22 282); --sign-hover: oklch(.62 .22 282); --sign-ink: oklch(1 0 0); --sign-glow: 0 1px 2px rgb(0 0 0 / .4);
  --glow: oklch(.74 .15 282 / .07);
  --safe: oklch(.79 .12 160); --watch: oklch(.83 .13 82); --act: oklch(.76 .15 48); --liq: oklch(.72 .18 25);
  --safe-bg: oklch(.79 .12 160 / .12); --watch-bg: oklch(.83 .13 82 / .12); --act-bg: oklch(.76 .15 48 / .13); --liq-bg: oklch(.72 .18 25 / .14);
  --safe-line: oklch(.79 .12 160 / .35); --watch-line: oklch(.83 .13 82 / .35); --act-line: oklch(.76 .15 48 / .50); --liq-line: oklch(.72 .18 25 / .5);
  --zone-liq: oklch(.66 .19 25 / .75); --zone-watch: oklch(.80 .14 75 / .55); --zone-safe: oklch(.74 .13 160 / .45);
  --series-1: oklch(.74 .15 282); --series-2: oklch(.58 .13 282); --series-3: oklch(.45 .09 282); --series-4: oklch(.72 .006 275); --series-5: oklch(.50 .006 275);
  --scrim: rgb(0 0 0 / .66); --pop-shadow: 0 0 0 1px rgb(255 255 255 / .10), 0 16px 48px rgb(0 0 0 / .55);
  --elev-1: 0 0 0 1px rgb(255 255 255 / .09), 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px -6px rgb(0 0 0 / .5);
  --note: oklch(.80 .02 275); --note-bg: rgb(255 255 255 / .04);
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-meta: 12px; --fs-xs: 13px; --fs-s: 14px; --fs-m: 15px; --fs-l: 17px; --fs-h: 19px; --fs-xl: 24px; --fs-kpi: 30px; --fs-hero: 56px;
  --r-xs: 6px; --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 20px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --ease: cubic-bezier(.16, 1, .3, 1); --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg-inset: oklch(.962 .004 275); --bg-page: oklch(.982 .003 275); --bg-surface: oklch(1 0 0);
  --bg-raised: oklch(1 0 0); --bg-overlay: oklch(1 0 0);
  --hover: rgb(15 20 30 / .04); --active: rgb(15 20 30 / .07);
  --line-subtle: rgb(15 20 30 / .06); --line: rgb(15 20 30 / .10); --line-strong: rgb(15 20 30 / .18); --line-control: rgb(15 20 30 / .30);
  --line-input: rgb(15 20 30 / .50); --line-mark: rgb(15 20 30 / .50);
  --text-1: oklch(.19 .010 275); --text-2: oklch(.42 .014 275); --text-3: oklch(.52 .014 275); --text-dis: oklch(.70 .010 275);
  --neutral-solid: oklch(.19 .010 275); --neutral-ink: oklch(.985 .002 275);
  --accent: oklch(.52 .20 282); --accent-muted: oklch(.52 .20 282 / .08); --accent-line: oklch(.50 .18 282 / .70);
  --sign: oklch(.52 .22 282); --sign-hover: oklch(.47 .22 282); --sign-ink: oklch(1 0 0); --sign-glow: 0 1px 2px rgb(15 20 30 / .12);
  --glow: oklch(.52 .20 282 / .05);
  --safe: oklch(.50 .12 160); --watch: oklch(.50 .12 70); --act: oklch(.50 .16 45); --liq: oklch(.52 .19 25);
  --safe-bg: oklch(.50 .12 160 / .08); --watch-bg: oklch(.70 .14 80 / .12); --act-bg: oklch(.56 .16 45 / .08); --liq-bg: oklch(.53 .19 25 / .07);
  --safe-line: oklch(.50 .12 160 / .30); --watch-line: oklch(.50 .12 70 / .35); --act-line: oklch(.50 .16 45 / .45); --liq-line: oklch(.52 .19 25 / .40);
  --zone-liq: oklch(.60 .20 25 / .70); --zone-watch: oklch(.78 .15 75 / .70); --zone-safe: oklch(.62 .13 160 / .45);
  --series-1: oklch(.52 .20 282); --series-2: oklch(.66 .14 282); --series-3: oklch(.80 .08 282); --series-4: oklch(.40 .01 275); --series-5: oklch(.72 .01 275);
  --scrim: rgb(10 14 20 / .4); --pop-shadow: 0 0 0 1px rgb(15 20 30 / .08), 0 16px 48px rgb(15 20 30 / .16);
  --elev-1: 0 0 0 1px rgb(15 20 30 / .08), 0 1px 2px rgb(15 20 30 / .06), 0 10px 30px -8px rgb(15 20 30 / .14);
  --note: oklch(.40 .02 275); --note-bg: rgb(15 20 30 / .03);
}

* { box-sizing: border-box; }
html { background: var(--bg-page); scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg-page); color: var(--text-1); font: 400 var(--fs-m)/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
::selection { background: var(--accent-muted); color: var(--text-1); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
input { caret-color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.012em; text-wrap: balance; }
b, strong { font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; }
.num { font-variant-numeric: tabular-nums slashed-zero; }
.mono { font-family: var(--mono); font-size: var(--fs-meta); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.s { width: 14px; height: 14px; } .i.l { width: 20px; height: 20px; }

/* prototype bar (not part of the product) */
.proto { background: #000; color: #e7e9ec; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12.5px; border-bottom: 1px solid #222; }
.proto-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.proto b { font-weight: 600; opacity: .6; letter-spacing: .04em; font-size: 11px; text-transform: uppercase; }
.proto .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.proto button { background: transparent; border: 1px solid #3a3d42; color: #e7e9ec; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.proto button[aria-pressed="true"] { background: #e7e9ec; color: #000; border-color: #e7e9ec; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in oklch, var(--bg-page) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-subtle); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1180px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: var(--s6); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-l); letter-spacing: -0.015em; white-space: nowrap; }
.logo svg { width: 22px; height: 22px; color: var(--accent); }
.nav { display: flex; gap: 2px; }
.nav a { padding: 6px 12px; border-radius: var(--r-s); color: var(--text-2); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
.nav a.on { color: var(--text-1); background: var(--active); }
.top-right { margin-left: auto; display: flex; gap: var(--s2); align-items: center; position: relative; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--line-strong); background: var(--bg-raised); color: var(--text-1); font-weight: 500; font-size: var(--fs-m); white-space: nowrap; transition: background .15s, border-color .15s, color .15s, box-shadow .2s, transform .16s var(--ease-out); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--neutral-solid); color: var(--neutral-ink); border-color: transparent; }
.btn.sign { background: var(--sign); color: var(--sign-ink); border-color: transparent; height: 52px; font-size: var(--fs-l); font-weight: 600; gap: 8px; box-shadow: var(--sign-glow); }
.btn:disabled, .btn.sign:disabled { background: var(--bg-raised); color: var(--text-dis); border-color: var(--line-subtle); cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.small { height: 32px; padding: 0 10px; font-size: var(--fs-s); }
.btn.block { width: 100%; }
.btn.nudge { animation: nudge .32s var(--ease-out); }
@keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.link { border: 0; background: none; padding: 0; color: var(--text-1); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-control); text-underline-offset: 3px; min-height: 24px; }
@media (hover: hover) and (pointer: fine) {
  .nav a:hover { background: var(--hover); color: var(--text-1); }
  .btn:hover:not(:disabled) { background: color-mix(in oklch, var(--bg-raised), var(--text-1) 6%); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in oklch, var(--neutral-solid), var(--bg-page) 12%); }
  .btn.sign:hover:not(:disabled) { background: var(--sign-hover); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text-1); }
  .link:hover { text-decoration-color: var(--text-2); }
  .wallet:hover { border-color: var(--line-control); }
  .pop .row.btnrow:hover { background: var(--hover); }
  .strat-opts label:hover { border-color: var(--line-control); }
  .sh-head .x:hover { background: var(--hover); color: var(--text-1); }
}

.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: var(--r-xs); font-size: var(--fs-meta); font-weight: 500; white-space: nowrap; background: transparent; color: var(--text-2); border: 1px solid var(--line-strong); }
.chip .i { width: 12px; height: 12px; stroke-width: 2; }
.chip .i.good { color: var(--safe); }
.chip.safe { background: var(--safe-bg); color: var(--safe); border-color: var(--safe-line); }
.chip.watch { background: var(--watch-bg); color: var(--watch); border-color: var(--watch-line); }
.chip.act { background: var(--act-bg); color: var(--act); border-color: var(--act-line); }
.chip.liq { background: var(--liq-bg); color: var(--liq); border-color: var(--liq-line); }
.chip.ai { background: var(--accent-muted); color: var(--accent); border-color: var(--accent-line); }
.chip.demo { background: var(--bg-overlay); color: var(--text-1); border-color: var(--line-control); }
.chip.big { height: 28px; padding: 0 10px; font-size: var(--fs-s); font-weight: 600; }
:root:not([data-theme="light"]) .chip.big.safe { background: oklch(from var(--safe) l c h / .2); } :root:not([data-theme="light"]) .chip.big.watch { background: oklch(from var(--watch) l c h / .2); } :root:not([data-theme="light"]) .chip.big.act { background: oklch(from var(--act) l c h / .2); } :root:not([data-theme="light"]) .chip.big.liq { background: oklch(from var(--liq) l c h / .22); }

.prov { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-meta); color: var(--text-3); font-weight: 400; white-space: nowrap; }
.prov::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; }
.prov.live::before { background: var(--text-3); }
.prov.est::before { border: 1.5px dashed var(--text-3); width: 5px; height: 5px; }
.prov.sim::before { background: repeating-linear-gradient(45deg, var(--text-3) 0 1.5px, transparent 1.5px 3px); border: 1px solid var(--text-3); width: 5px; height: 5px; }
.chip .simk { width: 8px; height: 8px; border-radius: 2px; border: 1px solid currentColor; background: repeating-linear-gradient(45deg, currentColor 0 1.5px, transparent 1.5px 3px); flex: none; }

.tok { width: 28px; height: 28px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; overflow: hidden; background: var(--bg-overlay); font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.tok img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tok.s { width: 18px; height: 18px; font-size: 9px; } .tok.l { width: 32px; height: 32px; }
.pair { display: inline-flex; }
.pair .tok + .tok { margin-left: -9px; box-shadow: 0 0 0 2px var(--bg-surface); }

.wallet { display: flex; align-items: center; gap: var(--s2); height: 36px; padding: 0 10px 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--bg-surface); transition: border-color .15s, transform .16s var(--ease-out); }
.wallet:active { transform: scale(.97); }
.wallet .stack { display: flex; }
.wallet .stack .tok { box-shadow: 0 0 0 2px var(--bg-surface); }
.wallet .stack .tok + .tok { margin-left: -6px; }
.wallet .who { font-weight: 500; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wallet .i { color: var(--text-3); transition: transform .2s var(--ease-out); }
.wallet[aria-expanded="true"] .i { transform: rotate(180deg); }

.pop { position: absolute; top: calc(100% + 8px); right: 0; width: 360px; max-width: calc(100vw - 32px); background: var(--bg-overlay); border-radius: var(--r-m); box-shadow: var(--pop-shadow); padding: 6px; z-index: 40; transform-origin: top right; animation: pop .16s var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.pop h4 { margin: 10px 10px 4px; font-size: var(--fs-xs); color: var(--text-3); font-weight: 500; }
.pop .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-s); }
.pop .row.btnrow { width: 100%; border: 0; background: transparent; text-align: left; min-height: 44px; }
.pop .row small { display: block; color: var(--text-2); font-size: var(--fs-xs); }
.pop .bal { margin-left: auto; text-align: right; font-weight: 500; white-space: nowrap; }
.pop .bal small { font-weight: 400; color: var(--text-3); }
.pop .sep { height: 1px; background: var(--line-subtle); margin: 6px 0; }
.pop .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 4px; }

/* page */
.page { max-width: 1180px; margin: 0 auto; padding-block: var(--s6) 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: var(--s8); }
.page > .note { margin-top: calc(var(--s6) * -1); }
.panel { background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.ctx { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); }
.ctx p { flex: 1 1 280px; color: var(--text-2); }
.ctx p b { color: var(--text-1); font-weight: 500; }
.ctx.demo, .ctx.ro { padding: var(--s3) var(--s4); border-radius: var(--r-m); border: 1px dashed var(--line-control); }

.intro { display: grid; grid-template-columns: 1.35fr 1fr; overflow: hidden; }
.intro > div { padding: var(--s6); }
.intro h1 { font-size: var(--fs-xl); line-height: 1.25; margin-bottom: var(--s2); letter-spacing: -0.02em; }
.intro .sub { color: var(--text-2); max-width: 62ch; font-size: var(--fs-m); }
.intro ol { margin: var(--s5) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s3); counter-reset: s; }
.intro ol > li { display: grid; grid-template-columns: 28px 1fr; gap: var(--s3); counter-increment: s; color: var(--text-2); align-items: start; }
.intro ol > li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent-line); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-xs); color: var(--accent); }
.intro ol > li b { color: var(--text-1); font-weight: 500; }
.trust { background: var(--bg-raised); border-left: 1px solid var(--line); display: grid; gap: var(--s3); align-content: start; }
.trust h2 { font-size: var(--fs-l); display: flex; gap: var(--s2); align-items: center; }
.trust h2 .i { color: var(--accent); }
.trust ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); color: var(--text-1); }
.trust ul > li { display: grid; grid-template-columns: 18px 1fr; gap: var(--s2); }
.trust ul > li .i { color: var(--text-2); margin-top: 3px; }

/* hero: on the page, no panel */
.hero { position: relative; isolation: isolate; display: grid; grid-template-columns: 1.6fr 1fr 1fr; padding-block: var(--s4) 0; }
.hero::before { content: ""; position: absolute; z-index: -1; left: -120px; top: -100px; width: 720px; height: 420px; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }
.hero > div { padding: 0 var(--s6); display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.hero > div:first-child { padding-left: 0; }
.hero > div + div { border-left: 1px solid var(--line); }
.lbl { font-size: var(--fs-s); color: var(--text-2); display: flex; gap: var(--s2); align-items: center; justify-content: space-between; font-weight: 500; }
.total { font-size: var(--fs-hero); font-weight: 500; letter-spacing: -0.035em; line-height: 1; margin-top: var(--s1); }
.total .c { color: var(--text-3); font-size: .6em; letter-spacing: -0.02em; }
.kpi { font-size: var(--fs-kpi); font-weight: 500; letter-spacing: -0.025em; line-height: 1.1; display: flex; align-items: center; gap: 8px; margin-top: var(--s1); }
.kpi .i { width: 22px; height: 22px; stroke-width: 2.25; }
.sub { color: var(--text-2); font-size: var(--fs-s); }
.up { color: var(--safe); } .down { color: var(--liq); }
.money-acts { display: flex; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; }
.alloc { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: var(--s3); max-width: 520px; }
.alloc span { display: block; height: 100%; transition: width .6s var(--ease); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-s); color: var(--text-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .tok.s { width: 16px; height: 16px; box-shadow: 0 0 0 1.5px var(--sw); }
.legend span b { color: var(--text-1); font-weight: 500; }
.other { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--fs-s); color: var(--text-2); padding-top: var(--s3); border-top: 1px solid var(--line-subtle); margin-top: var(--s2); max-width: 520px; }
.other .stack { display: inline-flex; }
.other .stack .tok + .tok { margin-left: -5px; }
.other b { color: var(--text-1); font-weight: 500; }

.gauge { position: relative; height: 8px; border-radius: 4px; background: var(--bg-inset); margin: var(--s8) 0 var(--s6); box-shadow: inset 0 0 0 1px var(--line); }
.gauge .zone { position: absolute; top: 0; bottom: 0; }
.gauge .zone.u { left: 0; background: var(--zone-liq); border-radius: 4px 0 0 4px; }
.gauge .zone.w { background: var(--zone-watch); }
.gauge .zone.s { right: 0; background: var(--zone-safe); border-radius: 0 4px 4px 0; }
.gauge .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-mark); }
.gauge .mk em { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; }
.gauge .mk.first em { left: 0; transform: none; }
.gauge .mk.up em { top: auto; bottom: 16px; }
.gauge .you { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--text-1); box-shadow: 0 0 0 3px var(--bg-page); transition: left .6s var(--ease); }
.panel .gauge .you { box-shadow: 0 0 0 3px var(--bg-surface); }
.card.top .gauge .you { box-shadow: 0 0 0 3px var(--bg-raised); }

/* analysis */
.an-head { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s4); align-items: center; padding: var(--s4) var(--s6); border-bottom: 1px solid var(--line-subtle); }

.run { margin-left: auto; display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; justify-content: flex-end; }

.run .btn { min-width: 172px; }
.run .btn.busy { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .6; } }
.verdict { padding: var(--s6) var(--s6) var(--s2); display: grid; gap: 4px; }
.verdict .v { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; display: flex; gap: var(--s2); align-items: center; }
.verdict .v .i { width: 22px; height: 22px; }
.verdict .sub { font-size: var(--fs-m); }
.strat { padding: var(--s3) var(--s6) var(--s5); display: grid; gap: var(--s2); border: 0; margin: 0; min-width: 0; }

.strat-opts label { position: relative; cursor: pointer; border: 1px solid var(--line-strong); background: transparent; border-radius: var(--r-s); padding: var(--s3) var(--s4); display: grid; gap: 2px; min-height: 64px; transition: border-color .15s, background .15s, transform .16s var(--ease-out); }

.strat-opts b { font-size: var(--fs-m); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.strat-opts span { font-size: var(--fs-s); color: var(--text-2); }

.strat-opts label:has(input:checked) { border-color: var(--accent-line); background: var(--accent-muted); }
.strat-opts label:has(input:checked) b .i { opacity: 1; transform: none; }

.pipe-wrap { padding: var(--s5) var(--s6); display: grid; gap: var(--s4); border-top: 1px solid var(--line-subtle); }
.pipe-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }

.pipe-head .sub { color: var(--text-3); }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.pn { position: relative; display: grid; gap: 2px; padding: 24px var(--s4) 0 0; font-size: var(--fs-s); color: var(--text-3); align-content: start; transition: color .2s; }
.pn .dot { position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-control); background: var(--bg-surface); z-index: 1; display: grid; place-items: center; color: var(--bg-surface); transition: background .2s, border-color .2s, transform .25s var(--ease-out); }
.pn .dot .i { width: 10px; height: 10px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 0; transition: stroke-dashoffset .3s .1s var(--ease-out); }
.pn::after { content: ""; position: absolute; top: 7.5px; left: 20px; right: 4px; height: 1px; background: var(--line-strong); }
.pn::before { content: ""; position: absolute; z-index: 1; top: 7.5px; left: 20px; right: 4px; height: 1px; background: var(--accent-line); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
.pn:last-child::after, .pn:last-child::before { display: none; }
.pn b { color: inherit; font-weight: 500; font-size: var(--fs-s); }
.pn small { font-size: var(--fs-xs); }
.pn em { font-style: normal; font-size: var(--fs-xs); color: var(--text-3); }
.pn.done { color: var(--text-2); } .pn.done b { color: var(--text-1); }
.pn.done .dot { background: var(--accent); border-color: var(--accent); }
.pn.done::before { transform: scaleX(1); }
.pn:not(.done) .dot .i { stroke-dashoffset: 24; }
.pn.now { color: var(--text-1); } .pn.now .dot { border-color: var(--accent); border-right-color: transparent; animation: sp .8s linear infinite; }
.pn.locked { color: var(--text-3); } .pn.locked .dot { border-style: dashed; color: var(--text-3); } .pn.locked .dot .i { stroke-dashoffset: 0; } .pn.locked::after { background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px); }

.checks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-subtle); }
.check { padding: var(--s4) var(--s6); display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line-subtle); min-width: 0; transition: opacity .25s; }
.check:first-child { border-left: 0; }
.check .who { font-size: var(--fs-s); color: var(--text-2); }
.check .res { font-weight: 600; display: flex; gap: 6px; align-items: center; color: var(--text-1); font-size: var(--fs-l); }
.check .res .i { width: 16px; height: 16px; stroke-width: 2.25; }
.check p { font-size: var(--fs-s); color: var(--text-2); }

.check .pick { justify-self: start; margin-top: 2px; }
.ok-c { color: var(--text-2); } .watch-c { color: var(--watch); } .act-c { color: var(--act); } .liq-c { color: var(--liq); } .na-c { color: var(--text-3); }
.res .ok-c, .res .na-c { color: var(--text-2); }
.codechecks { margin: 0 var(--s6) var(--s5); display: flex; flex-wrap: wrap; gap: 6px var(--s4); font-size: var(--fs-s); color: var(--text-2); padding: var(--s3) var(--s4); background: var(--bg-raised); border-radius: var(--r-s); }
.codechecks b { color: var(--text-1); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.codechecks b .i { color: var(--accent); }
.codechecks span { display: inline-flex; gap: 6px; align-items: center; }
.codechecks span .i { color: var(--text-2); width: 14px; height: 14px; }

/* suggestions */
.recs { display: grid; gap: var(--s3); }
.sec-head { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s1); }
.sec-head h2 { font-size: var(--fs-h); }
.sec-head span { color: var(--text-2); font-size: var(--fs-s); }
.card { position: relative; padding: var(--s5) var(--s6); display: grid; gap: var(--s4); }
.card.top { background: var(--bg-raised); border-color: transparent; box-shadow: var(--elev-1); }
.card.top::before { content: ""; position: absolute; left: -1px; top: var(--s6); bottom: var(--s6); width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.card.top.act::before { background: var(--act); }
.card.act { border-color: var(--act-line); }
.card.top.act { box-shadow: 0 0 0 1px var(--act-line), 0 10px 30px -6px rgb(0 0 0 / .45); }
.card.done { border-color: var(--line); }
.card.done::before { display: none; }
.card.working { border-color: var(--accent-line); }
.card-top { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.card-top .rank { font-size: var(--fs-s); font-weight: 600; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }
.card-top .agent { color: var(--text-2); font-size: var(--fs-s); }
.card-top .right { margin-left: auto; display: flex; gap: var(--s2); align-items: center; }
.card h3 { font-size: var(--fs-h); font-weight: 600; letter-spacing: -0.015em; display: flex; gap: var(--s3); align-items: center; line-height: 1.3; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border-radius: var(--r-s); background: color-mix(in oklch, var(--bg-surface), var(--text-1) 3%); border: 1px solid var(--line-subtle); }
.card.top .facts { background: color-mix(in oklch, var(--bg-raised), var(--text-1) 3.5%); }
.fact { display: grid; gap: 2px; padding: var(--s3) var(--s4); min-width: 0; }
.fact + .fact { border-left: 1px solid var(--line-subtle); }

.why { color: var(--text-1); max-width: 76ch; }
.why b { font-weight: 600; }
.card-foot { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; }
.card-foot .tags { display: flex; gap: var(--s3); flex-wrap: wrap; margin-right: auto; }
.receipt { display: grid; gap: 4px; padding: var(--s3) var(--s4); border-radius: var(--r-s); background: var(--safe-bg); border: 1px solid var(--safe-line); }
.receipt b { color: var(--safe); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.progress-line { display: flex; gap: var(--s2); align-items: center; color: var(--accent); font-weight: 500; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }

.skipped summary { padding: var(--s4) var(--s6); cursor: pointer; font-weight: 500; display: flex; gap: var(--s3); align-items: center; list-style: none; min-height: 52px; }
.skipped summary::-webkit-details-marker { display: none; }
.skipped summary .i { color: var(--text-2); transition: transform .2s var(--ease); }
.skipped[open] summary .i { transform: rotate(90deg); }
.skipped summary span { color: var(--text-2); font-weight: 400; }
.sk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--s4); padding: var(--s3) var(--s6); border-top: 1px solid var(--line-subtle); }
.sk-row .t { font-weight: 500; }
.sk-row .n { text-align: right; color: var(--text-1); }
.sk-row p { grid-column: 1 / -1; color: var(--text-2); font-size: var(--fs-s); }

/* holdings */
.hold { overflow: hidden; }
.hold-head { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: baseline; padding: var(--s4) var(--s6); }
.hold-head h2 { font-size: var(--fs-h); }
.hold-head span { color: var(--text-2); font-size: var(--fs-s); }
.grp-h { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s6) var(--s2); font-size: var(--fs-s); font-weight: 600; color: var(--text-2); border-top: 1px solid var(--line-strong); }
.grp-h .num { color: var(--text-1); font-weight: 500; }
.grp-h.ext { color: var(--text-2); font-weight: 500; border-top: 1px dashed var(--line-control); }
.hrow { display: grid; grid-template-columns: minmax(0, 2.2fr) 1.2fr 1.3fr 1fr; gap: var(--s3); align-items: center; padding: 0 var(--s6); height: 56px; border-top: 1px solid var(--line-subtle); }
.grp-h + .hrow { border-top: 0; }
.hrow.th { height: 36px; border-top: 0; font-size: var(--fs-meta); color: var(--text-3); font-weight: 500; }
.asset { display: flex; gap: var(--s3); align-items: center; min-width: 0; }
.asset b { display: block; font-weight: 500; }
.asset small { color: var(--text-2); font-size: var(--fs-s); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-amt { color: var(--text-1); }
.c-usd b { font-weight: 500; }
.r { text-align: right; }
.hold-foot { padding: var(--s3) var(--s6); border-top: 1px solid var(--line-subtle); display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); color: var(--text-2); font-size: var(--fs-s); align-items: center; }

.notes-on .note { display: block; }
.note { display: none; border-left: 2px solid var(--line-control); background: var(--note-bg); color: var(--text-2); padding: 10px 14px; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: var(--fs-s); }
.note::before { content: "UX · почему так"; display: block; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; color: var(--note); margin-bottom: 2px; }
.foot { color: var(--text-3); font-size: var(--fs-xs); max-width: 90ch; }

/* sheet: mounted once, content patched */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: grid; place-items: center; padding: var(--s4); animation: fade .2s var(--ease); }
.scrim.closing { animation: fadeout .15s ease-in forwards; }
.scrim.closing .sheet { animation: sink .15s ease-in forwards; }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes sink { to { transform: translateY(8px) scale(.985); opacity: 0; } }
.sheet { width: min(620px, 100%); max-height: calc(100dvh - 32px); overflow: auto; overscroll-behavior: contain; background: var(--bg-overlay); border-radius: var(--r-xl); box-shadow: var(--pop-shadow); display: grid; animation: rise .28s var(--ease); }

.grab { display: none; }
.sh-head { position: sticky; top: 0; background: var(--bg-overlay); padding: var(--s4) var(--s6) var(--s3); border-bottom: 1px solid var(--line-subtle); display: grid; gap: 4px; z-index: 1; }
.sh-head .x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: var(--r-s); border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; transition: background .15s, color .15s; }
.sh-head .ctxl { font-size: var(--fs-s); color: var(--text-2); padding-right: 44px; }
.sh-head h2 { font-size: var(--fs-xl); padding-right: 44px; letter-spacing: -0.02em; line-height: 1.25; }
.sh-body { padding: var(--s3) var(--s6); display: grid; gap: var(--s3); }
.changes { border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--bg-surface); }
.changes h3 { font-size: var(--fs-xs); color: var(--text-2); font-weight: 500; padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line-subtle); display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.chg { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); }
.chg + .chg { border-top: 1px solid var(--line-subtle); }
.chg .sgn { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.chg .sgn.out { background: var(--bg-raised); color: var(--text-1); } .chg .sgn.in { background: var(--safe-bg); color: var(--safe); } .chg .sgn.eq { background: var(--bg-raised); color: var(--text-2); }
.chg .amt { font-size: var(--fs-l); font-weight: 600; display: flex; gap: var(--s2); align-items: center; min-width: 0; }
.chg .usd { color: var(--text-2); font-size: var(--fs-s); text-align: right; }
.warn { padding: var(--s3) var(--s4); border-radius: var(--r-m); display: grid; gap: var(--s2); border: 1px solid; }
.warn.act { background: var(--act-bg); border-color: var(--act-line); }
.warn.liq { background: var(--liq-bg); border-color: var(--liq-line); }
.warn .wt { display: flex; gap: var(--s2); align-items: center; font-weight: 600; }
.warn.act .wt { color: var(--act); } .warn.liq .wt { color: var(--liq); }

.ack { display: flex; gap: var(--s3); align-items: center; font-size: var(--fs-s); font-weight: 500; cursor: pointer; min-height: 44px; padding: var(--s1) 0; }
.ack input { width: 18px; height: 18px; margin: 0; accent-color: var(--act); flex: none; }
.inline-kv { display: flex; flex-wrap: wrap; gap: 6px var(--s6); font-size: var(--fs-s); color: var(--text-2); }

.sign-block { display: grid; gap: var(--s2); }
.sign-block h3 { font-size: var(--fs-s); font-weight: 500; color: var(--text-2); }
.steps { border: 1px solid var(--line); border-radius: var(--r-s); }
.step { display: grid; grid-template-columns: 24px 1fr; gap: var(--s3); padding: var(--s3) var(--s4); align-items: start; }
.step + .step { border-top: 1px solid var(--line-subtle); }
.step .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-control); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); transition: background .2s, border-color .2s, color .2s; }
.step .n.ok { background: var(--safe); border-color: var(--safe); color: var(--bg-overlay); } .step .n.bad { background: var(--liq); border-color: var(--liq); color: var(--bg-overlay); } .step .n.run { border-color: var(--accent); color: var(--accent); }
.step .n .i { width: 12px; height: 12px; stroke-width: 2.5; }
.step small { display: block; color: var(--text-2); font-size: var(--fs-s); }
.raw { border: 1px solid var(--line); border-radius: var(--r-s); }
.raw summary { padding: 0 var(--s4); cursor: pointer; font-weight: 500; font-size: var(--fs-s); min-height: 44px; display: flex; align-items: center; gap: var(--s2); color: var(--text-2); list-style: none; }
.raw summary::-webkit-details-marker { display: none; }
.raw summary .i { transition: transform .2s var(--ease); }

.raw table { width: 100%; border-collapse: collapse; }
.raw td { padding: var(--s2) var(--s4); border-top: 1px solid var(--line-subtle); font-family: var(--mono); font-size: var(--fs-meta); color: var(--text-1); }
.raw td:last-child { text-align: right; color: var(--text-2); }
.safety-line { display: flex; flex-wrap: wrap; gap: 6px var(--s4); font-size: var(--fs-s); color: var(--text-2); padding: var(--s3) var(--s4); border-radius: var(--r-s); background: var(--bg-raised); align-items: center; }
.safety-line span { display: inline-flex; gap: 5px; align-items: center; }
.safety-line span .i { color: var(--text-2); width: 13px; height: 13px; stroke-width: 2.25; }

.sh-foot { position: sticky; bottom: 0; background: var(--bg-overlay); padding: var(--s3) var(--s6) var(--s4); border-top: 1px solid var(--line-subtle); display: grid; gap: var(--s2); }

.result { padding: var(--s3) var(--s4); border-radius: var(--r-m); border: 1px solid; display: grid; gap: 2px; animation: fade .3s var(--ease); }
.result.ok { background: var(--safe-bg); border-color: var(--safe-line); } .result.ok b { color: var(--safe); }

.field { display: grid; gap: 6px; }

.inbox { display: flex; gap: var(--s2); align-items: center; border: 1px solid var(--line-input); border-radius: var(--r-s); padding: 10px 12px; background: var(--bg-inset); transition: border-color .15s; }
.inbox:focus-within { border-color: var(--accent); }

.inbox .pick { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r-s); padding: 4px 10px 4px 4px; background: var(--bg-raised); font-weight: 500; white-space: nowrap; }
.src { display: flex; gap: var(--s3); align-items: center; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--bg-surface); }

.src .btn { margin-left: auto; }
.qr { width: 168px; height: 168px; border-radius: var(--r-s); display: grid; place-items: center; background: #fff; padding: 12px; }
.qr i { width: 100%; height: 100%; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/12px 12px; display: grid; place-items: center; border-radius: 4px; }
.qr span { background: #fff; color: #111; padding: 3px 6px; border-radius: 4px; font-size: var(--fs-xs); font-weight: 600; font-style: normal; }
.manual { display: grid; grid-template-columns: auto 1fr; gap: var(--s4); align-items: start; }
.addr { font-family: var(--mono); font-size: var(--fs-s); word-break: break-all; padding: 10px 12px; background: var(--bg-inset); border: 1px solid var(--line); border-radius: var(--r-s); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); margin: 0; font-size: var(--fs-s); }

.kv dd { margin: 0; text-align: right; font-weight: 500; }
.timeline { display: grid; position: relative; }
.timeline::before { content: ""; position: absolute; left: 11.5px; top: 18px; bottom: 18px; width: 1px; background: var(--line-strong); }
.tl { position: relative; display: grid; grid-template-columns: 24px 1fr; gap: var(--s3); padding: 7px 0; color: var(--text-3); align-items: center; transition: color .2s; }
.tl i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-control); margin-left: 5px; background: var(--bg-overlay); transition: background .2s, border-color .2s; }
.tl.done { color: var(--text-1); } .tl.done i { background: var(--accent); border-color: var(--accent); }
.tl.now { color: var(--text-1); font-weight: 500; } .tl.now i { border-color: var(--accent); border-right-color: transparent; animation: sp .8s linear infinite; }

#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--bg-overlay); color: var(--text-1); box-shadow: var(--pop-shadow); padding: 10px 14px; border-radius: 10px; z-index: 90; max-width: min(520px, calc(100vw - 32px)); font-size: var(--fs-s); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease-out); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* v5.2 analysis: one focal verdict, findings carry risk colour, strategy as a segmented control, pipeline demoted */
.analysis .verdict { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: var(--s4); align-items: center; padding: var(--s6) var(--s6) var(--s5); }
.vt { width: 48px; height: 48px; border-radius: var(--r-m); display: grid; place-items: center; background: var(--bg-raised); color: var(--text-1); font-size: var(--fs-xl); font-weight: 600; }
.vt.ai { background: var(--accent-muted); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.vt.act { background: var(--act-bg); color: var(--act); box-shadow: inset 0 0 0 1px var(--act-line); }
.vt.safe { background: var(--safe-bg); color: var(--safe); box-shadow: inset 0 0 0 1px var(--safe-line); }
.vt .i.l { width: 24px; height: 24px; stroke-width: 2; }
.vt .spin { width: 20px; height: 20px; color: var(--accent); }
.analysis .verdict .v { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; }
.analysis .verdict .sub { font-size: var(--fs-m); color: var(--text-2); margin-top: 2px; }
.analysis .strat { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); padding: 0 var(--s6) var(--s5); }
.analysis .strat legend { float: left; margin: 0; font-size: var(--fs-s); color: var(--text-2); font-weight: 500; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; gap: 2px; border-radius: 10px; background: var(--bg-inset); box-shadow: inset 0 0 0 1px var(--line); }
.seg label { position: relative; height: 32px; padding: 0 14px; display: grid; place-items: center; border-radius: 7px; font-size: var(--fs-s); font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, box-shadow .15s, transform .16s var(--ease-out); }
.seg label:active { transform: scale(.97); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent-muted); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.strat-why { flex: 1 1 260px; font-size: var(--fs-s); color: var(--text-2); }
.strat-why b { color: var(--text-1); font-weight: 600; }
.finds-h { padding: var(--s4) var(--s6) var(--s2); border-top: 1px solid var(--line-subtle); font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.analysis .checks { border-top: 0; gap: var(--s2); padding: 0 var(--s6) var(--s5); }
.analysis .check { border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s4); gap: var(--s2); background: transparent; }
.analysis .check:first-child { border-left: 1px solid var(--line); }
.analysis .check .who { font-size: var(--fs-xs); color: var(--text-3); font-weight: 500; }
.analysis .check .res { font-size: var(--fs-l); gap: var(--s2); line-height: 1.3; }
.analysis .check p { color: var(--text-2); }
.ci { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--bg-raised); color: var(--text-2); }
.ci .i { width: 14px; height: 14px; stroke-width: 2.25; }
.check.lv-warn { background: color-mix(in oklch, var(--watch) 6%, transparent); border-color: var(--watch-line); }
.check.lv-warn .ci { background: var(--watch-bg); color: var(--watch); }
.check.lv-bad { background: color-mix(in oklch, var(--act) 7%, transparent); border-color: var(--act-line); }
.check.lv-bad .ci { background: var(--act-bg); color: var(--act); }
.check.lv-ok .ci { color: var(--safe); }
.check.lv-na { border-style: dashed; } .check.lv-na .res { color: var(--text-2); }
.analysis .codechecks { margin-top: calc(var(--s2) * -1); }
.analysis .pipe-wrap { background: var(--bg-inset); border-radius: 0 0 var(--r-l) var(--r-l); padding: var(--s4) var(--s6); gap: var(--s3); }
.analysis .pn { font-size: var(--fs-xs); padding-top: 22px; }
.analysis .pn b { font-size: var(--fs-xs); color: var(--text-2); }
.analysis .pn.done b { color: var(--text-1); }
.analysis .pn small, .analysis .pn em { font-size: var(--fs-xs); color: var(--text-3); }
.analysis .pn .dot { width: 14px; height: 14px; }
.analysis .pn::after, .analysis .pn::before { top: 6.5px; left: 18px; }
.analysis .pn.done .dot, .analysis .pn .dot { background-clip: padding-box; }
.analysis .pn:not(.done):not(.now) .dot { background: var(--bg-inset); }
@media (max-width: 900px) { .analysis .checks { grid-template-columns: 1fr 1fr; } .analysis .check:nth-child(n) { border: 1px solid var(--line); } .analysis .check.lv-warn { border-color: var(--watch-line); } .analysis .check.lv-bad { border-color: var(--act-line); } .analysis .check.lv-na { border-style: dashed; } }
@media (max-width: 640px) {
  .analysis .verdict, .analysis .strat, .finds-h, .analysis .checks, .analysis .pipe-wrap { padding-left: var(--s4); padding-right: var(--s4); }
  .analysis .verdict { grid-template-columns: 40px minmax(0, 1fr); gap: var(--s3); } .vt { width: 40px; height: 40px; }
  .analysis .verdict .v { font-size: 22px; }
  .seg { display: grid; width: 100%; } .seg label { height: 40px; padding: 0 6px; }
  .analysis .checks { grid-template-columns: 1fr; padding-left: var(--s4); padding-right: var(--s4); }
  .analysis .check { padding: var(--s3) var(--s4); }
}

/* v5.3 intro: steps as stages, trust as lead + detail */
.intro ol { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); margin-top: var(--s6); }
.intro ol > li { grid-template-columns: 1fr; gap: 4px; padding: var(--s4); border-radius: var(--r-m); background: var(--bg-raised); align-content: start; }
.intro ol > li::before { width: 28px; height: 28px; margin-bottom: var(--s2); border: 0; background: var(--accent-muted); box-shadow: inset 0 0 0 1px var(--accent-line); font-size: var(--fs-s); }
.intro ol > li b { font-size: var(--fs-l); font-weight: 600; color: var(--text-1); }
.intro ol > li span { font-size: var(--fs-s); color: var(--text-2); }
.trust ul { color: var(--text-2); gap: var(--s3); }
.trust ul > li b { color: var(--text-1); font-weight: 600; }
.trust ul > li .i { color: var(--accent); }
.trust .link { justify-self: start; }
.why { color: var(--text-2); }
.why b { color: var(--text-1); }
@media (max-width: 640px) { .intro ol { grid-template-columns: 1fr; } .intro ol > li { grid-template-columns: 28px 1fr; column-gap: var(--s3); } .intro ol > li::before { grid-row: span 2; margin: 0; } }

.tabs { display: none; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr 1fr; row-gap: var(--s6); }
  .hero > div:first-child { grid-column: 1 / -1; padding-right: 0; }
  .hero > div:nth-child(2) { border-left: 0; padding-left: 0; }
  .checks { grid-template-columns: 1fr 1fr; }
  .check:nth-child(3) { border-left: 0; }
  .check:nth-child(n+3) { border-top: 1px solid var(--line-subtle); }
  .intro { grid-template-columns: 1fr; }
  .trust { border-left: 0; border-top: 1px solid var(--line); }
  .pipe { grid-template-columns: 1fr; gap: var(--s3); } .pn { padding: 0 0 0 28px; } .pn::after, .pn::before { display: none; }
}
@media (max-width: 640px) {
  .nav { display: none; }
  .top-in { height: 56px; gap: var(--s3); }
  .wallet .who { max-width: 100px; }
  .wallet { height: 44px; }
  .btn { height: 44px; } .btn.small { height: 40px; } .btn.sign { height: 52px; }
  .total { font-size: 44px; }
  .hero { grid-template-columns: 1fr; row-gap: var(--s5); padding-top: 0; }
  .hero > div { border-left: 0 !important; padding: 0; }
  .hero > div + div { border-top: 1px solid var(--line); padding-top: var(--s5); }
  .hero::before { left: -60px; width: 420px; }
  .checks { grid-template-columns: 1fr; }
  .check { border-left: 0 !important; border-top: 1px solid var(--line-subtle); padding: var(--s3) var(--s4); }
  .check:first-child { border-top: 0; }
  .an-head, .verdict, .strat, .pipe-wrap, .card, .hold-head { padding-left: var(--s4); padding-right: var(--s4); }
  .verdict .v { font-size: 22px; }
  .codechecks { margin-left: var(--s4); margin-right: var(--s4); }
  .strat-opts { grid-template-columns: 1fr; } .strat-opts label { min-height: 56px; }
  .run { margin-left: 0; justify-content: flex-start; width: 100%; }
  .fact + .fact { border-left: 0; border-top: 1px solid var(--line-subtle); }
  .hrow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; height: auto; padding: 10px var(--s4); }
  .hrow.th { display: none; }
  .hrow .c-amt { grid-column: 1; grid-row: 2; padding-left: 40px; color: var(--text-2); font-size: var(--fs-s); text-align: left; }
  .hrow .c-earn { grid-column: 2; grid-row: 2; justify-self: end; }
  .hrow .c-usd { grid-column: 2; grid-row: 1; }
  .grp-h, .sk-row, .hold-foot, .skipped summary { padding-left: var(--s4); padding-right: var(--s4); }
  .scrim { padding: 0; place-items: end stretch; }
  .sheet { width: 100%; max-height: 92dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; animation: drawer .4s var(--ease-drawer); }
  .scrim.closing .sheet { animation: drawerout .2s ease-in forwards; }
  @keyframes drawer { from { transform: translateY(100%); } }
  @keyframes drawerout { to { transform: translateY(100%); } }
  .grab { display: block; position: sticky; top: 0; z-index: 2; height: 20px; margin-bottom: -20px; touch-action: none; cursor: grab; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line-control); }
  .sh-head { padding-top: var(--s6); }
  .sh-head .x { width: 44px; height: 44px; top: 14px; right: 8px; }
  .sh-head, .sh-body, .sh-foot { padding-left: var(--s4); padding-right: var(--s4); }
  .sh-foot { padding-bottom: max(var(--s5), env(safe-area-inset-bottom, 0px)); }
  .manual { grid-template-columns: 1fr; justify-items: center; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in oklch, var(--bg-page) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line-subtle); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs a { display: grid; justify-items: center; gap: 4px; padding: 8px 0 10px; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); text-decoration: none; }
  .tabs a.on { color: var(--text-1); }
  .tabs a.on .i { color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .pop, .btn.nudge, .scrim.closing .sheet { animation-name: fade !important; }

function findRow(s, id) { for (const [, rows] of s.groups) for (const r of rows) if (r.id === id) return r; return null; }
function moveRow(s, id, to, patch) {
  for (const g of s.groups) { const i = g[1].findIndex((r) => r.id === id); if (i >= 0) { const [r] = g[1].splice(i, 1); Object.assign(r, patch, { flash: true }); let dest = s.groups.find((x) => x[0] === to); if (!dest) { dest = [to, []]; s.groups.unshift(dest); } dest[1].push(r); } }
  s.groups = s.groups.filter((g) => g[1].length);
}

function verdict(d) {
  const act = d.recs.filter((r) => r.sev === 'act' && !isDone(r)).length;

  const skip = d.skipped.length;
  if (act) return ['act', 'alert', 'Your loan needs attention now.', 'One urgent action, explained below.'];
  if (worth) return ['', '', `${worth} move${worth > 1 ? 's' : ''} worth doing.`, skip ? `${skip} more checked and skipped: they don’t beat the costs.` : 'Ranked by what they change for you.'];
  if (d.recs.length) return ['safe', 'check', 'All suggested moves are done.', 'The agents re-checked the portfolio after your transaction.'];
  return ['safe', 'check', 'Nothing to do right now.', 'Every check passed for your strategy. Doing nothing is the right call; we’ll flag anything that changes.'];

    const label = locked ? (i === 1 ? 'Rules ran all 4 agents' : 'AI ranking') : title;
    const sub2 = locked ? (i === 1 ? 'no model on this view' : 'owner’s wallet only') : sub;

// ponytail: index-based DOM patch with data-key guards, so nodes persist and CSS transitions play; morphdom if lists get reordered often
function morphInner(el, html) { const t = document.createElement('template'); t.innerHTML = html; morphKids(el, t.content); }
function morphKids(from, to) {
  const a = [...from.childNodes], b = [...to.childNodes];
  b.forEach((n, i) => {
    const o = a[i];
    if (!o) return from.appendChild(n);
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || (n.nodeType === 1 && o.dataset.key !== n.dataset.key)) return from.replaceChild(n, o);
    if (n.nodeType !== 1) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
    for (const at of [...o.attributes]) if (!n.hasAttribute(at.name) && !(at.name === 'open' && o.nodeName === 'DETAILS')) o.removeAttribute(at.name);
    for (const at of n.attributes) if (o.getAttribute(at.name) !== at.value) o.setAttribute(at.name, at.value);
    if (o.nodeName === 'INPUT') { if (o.type === 'checkbox' || o.type === 'radio') o.checked = n.hasAttribute('checked'); else if (o !== document.activeElement) o.value = n.getAttribute('value') ?? ''; }
    if (o.dataset.count && o._v !== undefined) return;
    morphKids(o, n);
  });
  for (let i = a.length - 1; i >= b.length; i--) a[i].remove();
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUps() {
  for (const el of document.querySelectorAll('[data-count]')) {
    const v = +el.dataset.v, from = el._v, f = el.dataset.count === 'money' ? money : (x) => (Math.abs(x) < 0.005 ? '$0.00' : sgn(x));
    el._v = v;
    if (from === undefined || from === v || reduced()) { el.innerHTML = f(v); continue; }
    const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3); el.innerHTML = f(from + (v - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}
function flashRows() {
  for (const el of document.querySelectorAll('[data-flash]')) el.animate([{ background: 'var(--safe-bg)' }, { background: 'transparent' }], { duration: 1600, easing: 'cubic-bezier(.16,1,.3,1)' });
  for (const [, rows] of state.data.groups) for (const r of rows) delete r.flash;
}

let lastFocus = null, lastKey = null;

    return;
  }
  const html = s.kind === 'review' ? reviewSheet(s) : s.kind === 'deposit' ? depositSheet(s) : withdrawSheet(s);
  if (!scrim) {
    lastFocus = document.activeElement; lastKey = lastFocus?.closest('[data-key]')?.dataset.key;
    L.insertAdjacentHTML('beforeend', `<div class="scrim" data-act="close-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div></div>`);
    scrim = L.querySelector('.scrim:not(.closing)');
    blockers.forEach((b) => (b.inert = true));
  }
  const sheet = scrim.firstElementChild;
  sheet.className = `sheet ${state.notes ? 'notes-on' : ''}`;
  const opened = !sheet.childNodes.length, kindKey = s.kind + (s.phase || '');
  if (sheet.dataset.k && sheet.dataset.k !== kindKey) sheet.scrollTop = 0;
  sheet.dataset.k = kindKey;
  morphInner(sheet, `<div class="grab" aria-hidden="true"></div>${html}`);
  if (opened) document.getElementById('sh-title')?.focus({ preventScroll: true });
}
const closeBtn = '<button class="x" data-act="close" aria-label="Close">' + '<svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>';

function reviewSheet(s) {
  const a = ACTIONS[s.action], d = state.data, canSign = d.ctx === 'mine';
  const phase = s.phase || 'review';
  const head = `<div class="sh-head"><span class="ctxl">${esc(a.ctx)}</span><h2 id="sh-title" tabindex="-1">${esc(a.title)}</h2>${phase === 'signing' ? '' : closeBtn}</div>`;
  if (phase === 'review') {
    const inKind = s.action.startsWith('repay') ? 'eq' : 'in';
    const gated = a.impact && !s.ack;
    return `${head}<div class="sh-body">
      <div class="changes"><h3><span>Balance changes</span><span class="prov sim">Simulated on current pool state</span></h3>
        <div class="chg"><span class="sgn out">${ic('minus', 's')}</span><span class="amt num"><span class="sr">You send</span>${tok(a.give[0], 's')}${a.give[1]}</span><span class="usd num">${a.give[2]}</span></div>
        <div class="chg"><span class="sgn ${inKind}">${ic(inKind === 'in' ? 'plus' : 'arrow', 's')}</span><span class="amt num"><span class="sr">${inKind === 'in' ? 'You receive' : 'Result'}</span>${tok(a.get[0], 's')}${a.get[1]}</span><span class="usd num">${a.get[2]}</span></div></div>
      ${a.impact ? `<div class="warn act"><span class="wt">${ic('alert')}Price impact ${a.impact.pct}% · about ${usd(a.impact.usd, 0)} lost to the pool</span><p>The pool is too thin for this size. Swap a smaller part, or split it over several days.</p>
        <label class="ack"><input type="checkbox" data-act="ack" ${s.ack ? 'checked' : ''}><span>I understand I receive about ${usd(a.impact.usd, 0)} less than the market price.</span></label></div>` : ''}
      <div class="inline-kv">${a.kv.map(([k, v]) => `<span>${k}<b class="num">${v}</b></span>`).join('')}</div>
      <div class="sign-block"><h3>What you will sign · ${a.steps.length} transaction${a.steps.length > 1 ? 's' : ''}</h3>
        <div class="steps">${a.steps.map(([t, sub], i) => `<div class="step"><span class="n">${i + 1}</span><div>${esc(t)}<small>${esc(sub)}</small></div></div>`).join('')}</div>
        <details class="raw"><summary>${ic('right', 's')}Exact calls (${a.raw.length})</summary><table>${a.raw.map(([r, m, g]) => `<tr><td>${r}</td><td>${m}</td><td>${g}</td></tr>`).join('')}</table></details>
        <div class="safety-line">${a.checks.map((c) => `<span>${ic('check')}${c}</span>`).join('')}<a href="#" data-act="toast" data-msg="/policy">How we check</a></div></div>
      ${a.impact ? note('impact') : ''}${note('sheet')}
    </div>
    <div class="sh-foot">${canSign
      ? `<button class="btn sign block" data-act="sign" ${gated ? 'disabled' : ''}>${ic(gated ? 'lock' : 'pen')}${gated ? 'Confirm the price impact to sign' : 'Sign in your wallet'}</button><span class="why-off ${gated ? 'gate' : ''}">${gated ? 'Tick “I understand” above to unlock signing.' : `Your wallet will show the same ${a.raw.length} call${a.raw.length > 1 ? 's' : ''}. Nothing is sent until you approve there.`}</span>`
      : `<button class="btn sign block" disabled>${ic('lock')}Sign in your wallet</button><span class="why-off">${d.ctx === 'demo' ? 'This is a demo portfolio: there is nothing to sign. Connect your wallet to do this on your own account.' : `Only the owner of <b>${esc(d.account)}</b> can sign. This preview is exactly what they would see.`}</span>`}</div>`;
  }
  const rows = a.steps.map(([t], i) => {
    const st = s.steps[i];
    const n = st === 'ok' ? `<span class="n ok">${ic('check')}</span>` : st === 'bad' ? `<span class="n bad">${ic('x')}</span>` : st === 'run' ? '<span class="n run"><span class="spin" style="width:10px;height:10px"></span></span>' : `<span class="n">${i + 1}</span>`;
    const sub = { wallet: 'Approve it in your wallet…', chain: 'Executing on NEAR…', ok: 'Confirmed on NEAR · tx 7QmP…k2Xa', bad: s.err, wait: 'Waiting' }[s.sub[i]] || '';
    return `<div class="step">${n}<div>${esc(t)}<small>${esc(sub)}</small></div></div>`;
  }).join('');
  let footer = '';
  if (phase === 'signing') footer = `<span class="why-off">Keep this window open until every step is confirmed on NEAR.</span>`;
  if (phase === 'done') footer = `<div class="result ok"><b>Done. Every step is confirmed on NEAR.</b><span>${esc(a.done?.text || 'Your portfolio is updating.')}</span></div><button class="btn primary block" data-act="close">Back to portfolio</button>`;
  if (phase === 'rejected') footer = `<div class="result warn2"><b>Not signed in your wallet.</b><span>Nothing was sent. You can review it again whenever you want.</span></div><button class="btn block" data-act="close">Close</button>`;
  if (phase === 'failed') footer = `<div class="result bad"><b>The transaction failed on NEAR.</b><span>${esc(s.err)} Your tokens did not move: a NEAR transaction either fully succeeds or is reverted.</span></div><button class="btn block" data-act="close">Close</button>`;
  return `${head}<div class="sh-body"><div class="steps">${rows}</div></div><div class="sh-foot">${footer}</div>`;
}

function depositSheet(s) {
  const d = state.data;
  if (s.phase === 'manual') return `<div class="sh-head"><span class="ctxl">Add funds to ${esc(d.account)} · manual transfer</span><h2 id="sh-title" tabindex="-1">Send exactly 10 USDC on Base</h2>${closeBtn}</div>
    <div class="sh-body">
      <div class="warn liq"><span class="wt">${ic('alert')}Only USDC on Base</span><p>Any other token, or USDC on another network, can be lost.</p></div>
      <div class="manual"><div class="qr"><i><span>QR · 10 USDC</span></i></div>
        <div style="display:grid;gap:12px;min-width:0;width:100%"><div class="field"><label>Deposit address · expires in <b class="num">9:52</b></label><div class="addr">0x7a3B9c41E2d0f5A18C6e94b0D3f27A5c81e6F0d2</div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="toast" data-msg="Скопировано: адрес">${ic('copy', 's')}Copy address</button><button class="btn small" data-act="toast" data-msg="Скопировано: 10">${ic('copy', 's')}Copy amount</button></div>
          <dl class="kv"><dt>You receive</dt><dd class="num">≥ 9.95 USDt</dd><dt>Refund if it fails</dt><dd>0x9c4e…a341</dd><dt>Arrives in</dt><dd>about 2 min</dd></dl></div></div>
    </div>
    <div class="sh-foot"><button class="btn block" data-act="dep-back">Back to sending with MetaMask</button></div>`;
  if (s.phase === 'status') return `<div class="sh-head"><span class="ctxl">Add funds to ${esc(d.account)}</span><h2 id="sh-title" tabindex="-1">10 USDC on Base → USDt on NEAR</h2>${closeBtn}</div>
    <div class="sh-body"><div class="timeline">${['Sent from MetaMask', 'Seen on Base', 'Swapping to USDt', 'Arrived in ' + d.account].map((t, i) => `<div class="tl ${i < s.tl ? 'done' : i === s.tl ? 'now' : ''}"><i></i><span>${t}</span></div>`).join('')}</div>
      ${s.tl >= 3 ? '<div class="result ok"><b>9.96 USDt arrived.</b><span>Your portfolio updates in a few seconds. The loan card can now offer a one-click repay.</span></div>' : '<span class="sub">You can close this window: we keep tracking and show the result on the portfolio.</span>'}</div>
    <div class="sh-foot"><button class="btn block ${s.tl >= 3 ? 'primary' : ''}" data-act="close">${s.tl >= 3 ? 'Back to portfolio' : 'Close and keep tracking'}</button></div>`;
  return `<div class="sh-head"><span class="ctxl">Add funds to ${esc(d.account)} · via 1Click</span><h2 id="sh-title" tabindex="-1">Bring money from another chain</h2>${closeBtn}</div>
    <div class="sh-body">
      <div class="field"><label>From</label><div class="src">${tok('BASE')}<div><b>MetaMask · 0x9c4e…a341</b><small class="num">Base · 214.50 USDC available</small></div><button class="btn small" data-act="toast" data-msg="Base, Ethereum, Arbitrum, Solana, Bitcoin (вручную).">Change</button></div></div>
      <div class="field"><label for="amt">You send</label><div class="inbox"><input id="amt" class="num" value="10" inputmode="decimal"><span class="pick">${tok('USDC', 's')}USDC</span></div></div>
      <div class="field"><label for="rcv">You receive on NEAR</label><div class="inbox"><input id="rcv" class="num" value="≥ 9.95" readonly><span class="pick">${tok(s.recv || 'USDt', 's')}${s.recv || 'USDt'}</span></div></div>
      <dl class="kv"><dt>1Click fee</dt><dd>0.05% · included</dd><dt>Arrives in</dt><dd>about 2 min</dd><dt>If it fails</dt><dd>Refunded to 0x9c4e…a341</dd></dl>
      ${note('deposit')}
    </div>
    <div class="sh-foot"><button class="btn sign block" data-act="dep-send">${ic('pen')}Send with MetaMask</button>
      <button class="btn ghost small" data-act="dep-manual">No wallet on that chain? Send manually (address or QR)</button></div>`;
}
function withdrawSheet() {
  const d = state.data;
  return `<div class="sh-head"><span class="ctxl">Withdraw from ${esc(d.account)} · via 1Click</span><h2 id="sh-title" tabindex="-1">Send money to another chain</h2>${closeBtn}</div>
    <div class="sh-body">
      <div class="field"><label for="wamt">From your NEAR wallet</label><div class="inbox"><input id="wamt" class="num" value="25" inputmode="decimal"><span class="pick">${tok('USDC', 's')}USDC</span></div><span class="sub num">Available: 29.20 USDC (example)</span></div>
      <div class="field"><label>To</label><div class="src">${tok('BASE')}<div><b>MetaMask · 0x9c4e…a341</b><small>Base · USDC</small></div><button class="btn small" data-act="toast" data-msg="Другой адрес или сеть.">Change</button></div></div>
      <dl class="kv"><dt>You receive on Base</dt><dd class="num">≥ 24.95 USDC</dd><dt>Arrives in</dt><dd>about 2 min</dd></dl>
      <span class="sub">Next you review the exact NEAR transaction, same as every other action.</span>
    </div>
    <div class="sh-foot"><button class="btn primary block" data-act="toast" data-msg="Дальше — то же окно проверки и подписи.">Review transfer${ic('arrow', 's')}</button></div>`;
}

function startSign() {
  const s = state.sheet, a = ACTIONS[s.action], id = s.cardId;
  s.phase = 'signing'; s.steps = a.steps.map(() => 'idle'); s.sub = a.steps.map(() => 'wait');
  s.steps[0] = 'run'; s.sub[0] = 'wallet'; state.life[id] = { stage: 'signing' }; render();
  setTimeout(() => {
    if (state.outcome === 'reject') { s.phase = 'rejected'; s.steps[0] = 'bad'; s.sub[0] = 'bad'; s.err = 'You declined in the wallet.'; state.life[id] = { stage: 'failed', text: 'You declined in the wallet. Nothing was sent.' }; return render(); }
    s.sub[0] = 'chain'; render();
    setTimeout(() => {
      if (state.outcome === 'fail') { s.phase = 'failed'; s.steps[0] = 'bad'; s.sub[0] = 'bad'; s.err = 'Rhea: the price moved past your minimum (slippage).'; state.life[id] = { stage: 'failed', text: 'Failed on NEAR: the price moved past your minimum. Nothing moved.' }; return render(); }
      s.steps[0] = 'ok'; s.sub[0] = 'ok'; s.phase = 'done'; s.pending = { id, text: a.done?.text || 'Done.', effect: a.done?.effect };
      render();
    }, 1300);
  }, 1300);
}

let toastT;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = 'Прототип: ' + msg; requestAnimationFrame(() => t.classList.add('on')); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

function closeSheet() {
  const s = state.sheet;
  if (!s || s.phase === 'signing') return;
  state.sheet = null;
  const p = s.pending;
  if (!p) return render();
  renderSheet();
  setTimeout(() => {
    const apply = () => { state.life[p.id] = { stage: 'done', text: p.text }; if (p.effect) p.effect(state.data); state.recheck = true; render(); document.querySelector(`[data-key="${p.id}"] button`)?.focus({ preventScroll: true }); };
    if (document.startViewTransition && !reduced()) document.startViewTransition(apply).finished.then(flashRows); else { apply(); flashRows(); }
    setTimeout(() => { state.recheck = false; render(); }, 1800);
  }, 160);
}

let drag = null;
document.addEventListener('pointerdown', (e) => { const g = e.target.closest('.grab'); if (!g || state.sheet?.phase === 'signing') return; drag = { y: e.clientY, el: g.parentElement, dy: 0 }; g.setPointerCapture(e.pointerId); drag.el.style.transition = 'none'; });
document.addEventListener('pointermove', (e) => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); drag.el.style.transform = `translateY(${drag.dy}px)`; });
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const { el, dy } = drag; drag = null;
  el.style.transition = 'transform .3s cubic-bezier(.32,.72,0,1)';
  if (dy > 100) { el.style.transform = 'translateY(100%)'; setTimeout(() => { el.style.cssText = ''; closeSheet(); }, 200); } else { el.style.transform = ''; setTimeout(() => (el.style.cssText = ''), 300); }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset?.act === 'ack' && state.sheet) { state.sheet.ack = e.target.checked; renderSheet(); }
  if (e.target.name === 'strat') { state.strategy = e.target.value; render(); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-scen],[data-out],#p-notes,#p-theme');
  if (!el) { if (state.pop && !e.target.closest('.pop')) { state.pop = null; render(); } return; }
  if (el.dataset.scen) { state.scen = el.dataset.scen; return load(); }
  if (el.dataset.out) { state.outcome = el.dataset.out; return render(); }
  if (el.id === 'p-notes') { state.notes = !state.notes; el.setAttribute('aria-pressed', state.notes); el.textContent = state.notes ? 'вкл' : 'выкл'; return render(); }
  if (el.id === 'p-theme') { const light = document.documentElement.dataset.theme !== 'light'; if (light) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme; el.setAttribute('aria-pressed', light); return; }
  const act = el.dataset.act;
  if (act === 'ack') return;
  if (!['pop', 'deposit', 'withdraw', 'toast'].includes(act)) state.pop = null;
  if (act === 'close-scrim') { if (e.target === el) closeSheet(); return; }
  e.preventDefault();
  switch (act) {
    case 'pop': state.pop = state.pop === el.dataset.pop ? null : el.dataset.pop; break;
    case 'toast': return toast(el.dataset.msg);
    case 'review': { const r = [...state.data.recs, { id: 'supply-usdc', action: 'supply' }].find((x) => x.id === el.dataset.id); state.sheet = { kind: 'review', action: r.action, cardId: r.id }; break; }
    case 'sign': if (el.disabled) return; return startSign();
    case 'close': return closeSheet();
    case 'run': { const T = [600, 850, 1300, 950, 500]; state.running = 0; render(); const tick = () => { state.running++; if (state.running > STAGES.length - 1) { state.running = null; state.ranAt = '1 s'; } render(); if (state.running !== null) setTimeout(tick, T[state.running]); }; setTimeout(tick, T[0]); return; }
    case 'deposit': if (state.data.ctx !== 'mine') return toast('Пополнение доступно для своего кошелька.'); state.pop = null; state.sheet = { kind: 'deposit', recv: el.dataset.recv || 'USDC' }; break;
    case 'withdraw': state.pop = null; state.sheet = { kind: 'withdraw' }; break;
    case 'dep-manual': state.sheet.phase = 'manual'; break;
    case 'dep-back': state.sheet.phase = null; break;
    case 'dep-send': { const s = state.sheet; s.phase = 'status'; s.tl = 0; render(); const tick = () => { if (state.sheet !== s || s.tl >= 3) return; s.tl++; render(); setTimeout(tick, 1100); }; setTimeout(tick, 1100); return; }
  }
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.sheet) return closeSheet();
  if (state.pop) { state.pop = null; render(); document.querySelector('.wallet')?.focus(); }
});
document.addEventListener('click', (e) => { const b = e.target.closest('.btn.sign:disabled'); if (b) { b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); document.querySelector('.ack')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }, true);
load();
</script>
</body>
</html>
