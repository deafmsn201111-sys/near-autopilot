# The public site on a server: the mainnet analytics dashboard, served over HTTPS by Caddy or Tailscale Funnel.
# See deploy/public/README.md. Nothing listens on a public interface except Caddy (80, 443) when its profile is on;
# the dashboard is on 127.0.0.1:3000, every other service is on the internal network only.
#
# What this stack can do: read NEAR mainnet with view calls, analyse two SIMULATED demo portfolios, and build an exact
# UNSIGNED transaction cascade for a connected wallet (validateCascade caps: 0.15 NEAR per action, 0.3 per cascade).
# What it cannot do: sign or send anything. The server holds no key; NEAR_NETWORK / DATA_SOURCE / EXECUTION_MODE /
# MAINNET_WALLET_SIGNING are fixed here, not read from .env.
# Secrets: each one goes only to the services that use it; never add a new secret to x-common-env.
name: near-autopilot-public

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
  DATABASE_URL: postgres://autopilot:${POSTGRES_PASSWORD}@postgres:5432/autopilot
  NEAR_NETWORK: mainnet
  DATA_SOURCE: simulation
  EXECUTION_MODE: dry-run
  # Served by the in-process mock in simulation; never contacted.
  NEAR_RPC_URL: https://rpc.mainnet.near.org
  AUTOPILOT_ACCOUNT_ID: shadow-demo.near
  AUTOPILOT_ENGINE: orchestrator
  MARKET_CONFIG_FILE: /etc/near-autopilot/market.json
  MARKET_DATA: mainnet-live
  YIELD_DATA: mainnet-onchain
  RHEA_DCL_CONTRACT_ID: dclv2.ref-labs.near
  # Read-only mainnet RPC (view calls only).
  MAINNET_READ_RPC_URL: ${MAINNET_READ_RPC_URL:-https://rpc.mainnet.fastnear.com}
  MAINNET_READ_RPC_API_KEY: ${MAINNET_READ_RPC_API_KEY:-}
  PYTH_API_KEY: ${PYTH_API_KEY:-}
  PYTH_HERMES_URL: https://hermes.pyth.network
  DEFILLAMA_URL: https://coins.llama.fi
  COINBASE_URL: https://api.exchange.coinbase.com
  KRAKEN_URL: https://api.kraken.com
  BINANCE_URL: https://data-api.binance.vision
  ONE_CLICK_URL: https://1click.chaindefuser.com
  # shadow-demo.near does not exist on mainnet and 1Click refuses it; a dry quote sends nothing to this account.
  ONE_CLICK_QUOTE_ACCOUNT: near

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autopilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autopilot -d autopilot']
      interval: 5s
      timeout: 3s
      retries: 10

  # Reads mainnet on a schedule (view calls only) and stores it. No LLM calls.
  shadow-collector:
    image: ${API_IMAGE:-near-autopilot-api:public}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    command: ['node', '--import', 'tsx', 'src/collector/main.ts']
    environment:
      <<: *common-env
      SHADOW_CYCLE_INTERVAL_SECONDS: ${SHADOW_CYCLE_INTERVAL_SECONDS:-900}
      COLLECTOR_REGISTRY_EVERY: 4
      COLLECTOR_HEALTH_PORT: 4100
      AUDIT_CHECKPOINT_KEY: ${AUDIT_CHECKPOINT_KEY:-}
      AUDIT_CHECKPOINT_FILE: /checkpoints/checkpoints.jsonl
    volumes:
      - ./config/market.json:/etc/near-autopilot/market.json:ro
      - ./checkpoints:/checkpoints
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/health']
      interval: 30s
      timeout: 5s
      retries: 5

  # Applies the migrations, then serves the stored data to the dashboard, read-only.
  analytics-api:
    image: ${API_IMAGE:-near-autopilot-api:public}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', '--import', 'tsx', 'src/analytics/main.ts']
    environment:
      NODE_ENV: production
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      DATABASE_URL: postgres://autopilot:${POSTGRES_PASSWORD}@postgres:5432/autopilot
      API_PORT: 4000
      SHADOW_CYCLE_INTERVAL_SECONDS: ${SHADOW_CYCLE_INTERVAL_SECONDS:-900}
      AUDIT_CHECKPOINT_PUBLIC_KEY: ${AUDIT_CHECKPOINT_PUBLIC_KEY:-}
      AUDIT_CHECKPOINT_FILE: /checkpoints/checkpoints.jsonl
      MAINNET_READ_RPC_URL: ${MAINNET_READ_RPC_URL:-https://rpc.mainnet.fastnear.com}
      MAINNET_READ_RPC_API_KEY: ${MAINNET_READ_RPC_API_KEY:-}
      # Server LLM: only this service gets the key. Empty = LLM off, heuristics only.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
      LLM_DAILY_CAP_USD: ${LLM_DAILY_CAP_USD:-5}
      # The only token /v1/admin/* accepts. Held by analytics-admin too, never by the public site.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env (>= 32 chars; setup.sh adds it)}
      MARKET_CONFIG_FILE: /etc/near-autopilot/market.json
    volumes:
      - ./checkpoints:/checkpoints:ro
      - ./config/market.json:/etc/near-autopilot/market.json:ro

  # The site. Wallet signing is on (fixed: not read from .env): the user signs in their own wallet.
  analytics:
    image: ${ANALYTICS_IMAGE:-near-autopilot-analytics:public}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://analytics-api:4000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      MAINNET_WALLET_SIGNING: '1'
    # Loopback only. Exposed by Caddy (profile `caddy`) or by Tailscale Funnel on the host (README).
    ports:
      - '127.0.0.1:3000:3000'

  # The admin (/admin: AI spend, kill switch, cap). Same image; loopback only, no Caddy route: open it through an SSH
  # tunnel (README). Never publish it on 0.0.0.0: Docker bypasses ufw.
  analytics-admin:
    image: ${ANALYTICS_IMAGE:-near-autopilot-analytics:public}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      analytics-api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://analytics-api:4000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env (>= 32 chars)}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env (>= 32 chars; setup.sh adds it)}
      ADMIN_UI: '1'
    ports:
      - '127.0.0.1:3002:3000'

  # With profile `caddy` (COMPOSE_PROFILES=caddy in .env): the only service reachable from the internet, ports 80/443,
  # with a Let's Encrypt certificate for SITE_ADDRESS. Needs inbound 80 and 443; behind a NAT use Tailscale Funnel.
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      analytics:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
