name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint # eslint (incl. layer boundaries) + scripts/check-boundaries.mjs
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  db:
    # Migrations + DrizzleRepository against a real PostgreSQL (the same major version docker-compose uses).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @near-autopilot/api test:db
        env:
          DATABASE_TEST_URL: postgres://ci:ci@localhost:5432/postgres

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^API_TOKEN=.*/API_TOKEN=ci-token-ci-token-ci-token-ci-token-12/' .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

  notify:
    # Push to main only: a red main opens (or comments on) one "main is red" issue; the next green main closes it.
    if: always() && github.event_name == 'push'
    needs: [verify, db, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
    steps:
      - run: |
          open=$(gh issue list --label main-red --state open --json number --jq '.[].number')
          issue=$(echo "$open" | head -n1)
          if [ "$FAILED" = true ]; then
            msg="CI failed on \`main\` at $SHA (merged by @$ACTOR): $RUN_URL"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$msg"
            else
              gh label create main-red --color B60205 --description "CI is failing on main" --force
              gh issue create --title "main is red" --label main-red --assignee "$ACTOR" --body "$msg" ||
                gh issue create --title "main is red" --label main-red --body "$msg"
            fi
          else
            for n in $open; do gh issue close "$n" --comment "main is green again at $SHA: $RUN_URL"; done
          fi
